[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generator for the A-Maze-ing 42 project"
readme = "mazegen/README.md"
requires-python = ">=3.10"
authors = [
    { name = "ddervish" },
    { name = "dshabani" },
]
license = { text = "MIT" }

[tool.setuptools]
packages = ["mazegen"]

[tool.setuptools.package-data]
mazegen = ["README.md"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = ["maze_env", "build", "dist"]
